# Ce fichier dit à GitHub : "à chaque envoi de code sur la branche main,
# compile le site avec Vite et publie le résultat sur GitHub Pages".
name: Publier sur GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch: # permet aussi de lancer la publication à la main depuis l'onglet Actions

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  compiler:
    runs-on: ubuntu-latest
    steps:
      - name: Récupérer le code
        uses: actions/checkout@v4
      - name: Installer Node.js
        uses: actions/setup-node@v4
        with:
          node-version: lts/*
          cache: npm
      - name: Installer les dépendances (versions exactes du package-lock.json)
        run: npm ci
      - name: Compiler le site
        run: npm run build
      - name: Préparer Pages
        uses: actions/configure-pages@v5
      - name: Envoyer le dossier compilé
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  publier:
    needs: compiler
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploiement.outputs.page_url }}
    steps:
      - name: Mettre en ligne
        id: deploiement
        uses: actions/deploy-pages@v4
